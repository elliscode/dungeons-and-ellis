<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D&E — DM Login</title>
  <link rel="icon" href="/static/images/chest.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="center-screen">
    <form class="card login-card" id="login">
      <h1>Dungeons &amp; Ellis</h1>
      <p class="muted">Dungeon Master login</p>
      <input type="password" id="password" placeholder="DM password" autocomplete="current-password" autofocus required>
      <button class="primary" type="submit">Enter</button>
      <p class="muted" style="font-size:12px">Players: use the game link your DM gave you.</p>
    </form>
  </div>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
